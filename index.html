<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See You Soon 💕 | Countdown to June 21</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-decoration">
        <div class="floating-circle circle-1"></div>
        <div class="floating-circle circle-2"></div>
        <div class="floating-circle circle-3"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="main-title">✨ Counting Down to See You ✨</h1>
                <p class="quote-container">
                    <span class="quote-text" id="quote"></span>
                </p>
            </div>
        </header>

        <main class="main-content">
            <!-- Big Countdown Number -->
            <div class="countdown-section">
                <div class="countdown-wrapper">
                    <span class="countdown-number" id="countdownDays">0</span>
                    <span class="countdown-label">days to go</span>
                </div>
                <p class="subtitle">Until I'm home on <span class="highlight-date">June 21, 2026</span></p>
            </div>

            <!-- Calendar Section -->
            <div class="calendar-section">
                <div class="calendar-header">
                    <button class="nav-button" id="prevBtn" aria-label="Previous month">←</button>
                    <h2 class="month-title" id="monthTitle">April 2026</h2>
                    <button class="nav-button" id="nextBtn" aria-label="Next month">→</button>
                </div>

                <div class="weekdays">
                    <div class="weekday">Sun</div>
                    <div class="weekday">Mon</div>
                    <div class="weekday">Tue</div>
                    <div class="weekday">Wed</div>
                    <div class="weekday">Thu</div>
                    <div class="weekday">Fri</div>
                    <div class="weekday">Sat</div>
                </div>

                <div class="calendar-grid" id="calendarGrid"></div>

                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-box today"></div>
                        <span>Today</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-box past"></div>
                        <span>Passed</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-box event"></div>
                        <span>Special Day</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-box final-day"></div>
                        <span>Arrival Day</span>
                    </div>
                </div>

                <!-- Event Popup -->
                <div class="event-popup" id="eventPopup">
                    <div class="event-content">
                        <div class="event-name" id="eventName"></div>
                        <div class="event-daysLeft" id="eventDaysLeft"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Made with 💕 for you | See you very soon!</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
